services:
  - type: web
    name: smart-knowledge-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run db:generate --workspace=@knowledge/database && npm run build --workspace=@knowledge/shared && npm run build --workspace=@knowledge/database && npm run build --workspace=@knowledge/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
